<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approved records · Document Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site">
      <h1>Document Extractor</h1>
      <nav>
        <a href="/">Upload &amp; review</a>
        <a href="/dashboard.html" aria-current="page">Approved records</a>
      </nav>
    </header>

    <main>
      <section class="panel">
        <h2>Approved records</h2>
        <p class="hint" id="count">Loading…</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Approved</th>
                <th>Quote reference</th>
                <th>Client</th>
                <th>Insurer</th>
                <th>Policy type</th>
                <th>Premium</th>
                <th>Start date</th>
                <th>Cover limit</th>
                <th>Source file</th>
                <th>Edited by reviewer</th>
              </tr>
            </thead>
            <tbody id="records"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/dashboard.js"></script>
  </body>
</html>
