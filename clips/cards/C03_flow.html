<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>C3 flow card</title>
    <link rel="stylesheet" href="cards.css" />
    <style>
      .flow {
        margin-top: 92px;
        display: grid;
        grid-template-columns: 1fr 40px 1fr 40px 1fr 40px 1fr 40px 1fr;
        align-items: center;
      }
      .step {
        height: 300px;
        border: 3px solid var(--line);
        border-radius: 24px;
        padding: 28px 8px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        text-align: center;
      }
      .step .num { font-size: 22px; font-weight: 700; color: var(--muted); }
      .step .icon { width: 84px; height: 84px; }
      .step .icon svg { width: 46px; height: 46px; }
      .step .label { font-size: 32px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em; }
      .step.amber { border-color: var(--amber-accent); background: #fffbf0; }
      .step.green { border-color: var(--green); background: #f6fbf7; }
      .arrow svg { width: 40px; height: 40px; color: var(--muted); overflow: visible; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <h1 class="fade" style="animation-delay: 0.1s">How it works</h1>

      <div class="flow">
        <div class="step appear" style="animation-delay: 1s">
          <span class="num">1</span>
          <span class="icon ink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span>
          <span class="label">PDF in</span>
        </div>
        <div class="arrow draw" style="animation-delay: 4.9s"><svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22h30M28 13l9 9-9 9"/></svg></div>
        <div class="step appear" style="animation-delay: 5.5s">
          <span class="num">2</span>
          <span class="icon ink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/><path d="M8 11h6M11 8v6"/></svg></span>
          <span class="label">AI reads it</span>
        </div>
        <div class="arrow draw" style="animation-delay: 9.4s"><svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22h30M28 13l9 9-9 9"/></svg></div>
        <div class="step amber appear" style="animation-delay: 10s">
          <span class="num">3</span>
          <span class="icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10M7 11h10M7 15h6"/><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6l-5 4v-4H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="label">Shows the source</span>
        </div>
        <div class="arrow draw" style="animation-delay: 13.9s"><svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22h30M28 13l9 9-9 9"/></svg></div>
        <div class="step green appear" style="animation-delay: 14.5s">
          <span class="num">4</span>
          <span class="icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-1a6 6 0 0 1 9-5.2"/><path d="m14 18 3 3 5-6"/></svg></span>
          <span class="label">Person approves</span>
        </div>
        <div class="arrow draw" style="animation-delay: 18.4s"><svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22h30M28 13l9 9-9 9"/></svg></div>
        <div class="step green appear" style="animation-delay: 19s">
          <span class="num">5</span>
          <span class="icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg></span>
          <span class="label">Saved to dashboard</span>
        </div>
      </div>

      <div class="footer fade" style="animation-delay: 0.4s">Document Extractor</div>
    </div>
  </body>
</html>
